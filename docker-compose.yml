version: "3.8"
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: threat-orchestrator-db
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hackathon123
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
      - clickhouse-logs:/var/log/clickhouse-server/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data:
  clickhouse-logs:
