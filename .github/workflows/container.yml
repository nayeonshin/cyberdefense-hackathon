name: Test and publish Member 4 image
on:
  push:
    branches: [member4-shipper]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
      - name: Container smoke and persistence test
        run: |
          docker run -d --name demo -p 8501:8501 -v demo-data:/data ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker exec demo python -c "from pathlib import Path; Path('/data/persistence-check').write_text('retained')"
          docker restart demo
          docker exec demo python -c "from pathlib import Path; assert Path('/data/persistence-check').read_text() == 'retained'"
          docker logs demo
          docker stop demo
      - name: Push verified image
        run: docker push ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
