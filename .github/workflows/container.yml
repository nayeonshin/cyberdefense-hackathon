name: Test and publish Member 4 image
on:
  push:
    branches: [member4-shipper]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
      - name: Container smoke and persistence test
        run: |
          docker network create demo-net
          docker run -d --name clickhouse-ci --network demo-net \
            -e CLICKHOUSE_USER=demo -e CLICKHOUSE_PASSWORD=ci-only \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
          for attempt in $(seq 1 30); do
            if docker exec clickhouse-ci clickhouse-client --user demo --password ci-only --query 'SELECT 1'; then break; fi
            sleep 2
          done
          docker exec clickhouse-ci clickhouse-client --user demo --password ci-only --query 'SELECT 1'
          docker run -d --name demo --network demo-net -p 8501:8501 -v demo-data:/data \
            -e DATA_SOURCE=clickhouse -e EVENTS_TABLE=shipper_events \
            -e CLICKHOUSE_HOST=clickhouse-ci -e CLICKHOUSE_PORT=8123 \
            -e CLICKHOUSE_USER=demo -e CLICKHOUSE_PASSWORD=ci-only -e CLICKHOUSE_SECURE=0 \
            -e RUN_MODE=controlled -e RUN_ID=ci-controlled \
            -e 'TEAM_PIPELINE_COMMAND_JSON=["python","-m","shipper.team_pipeline"]' \
            ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker exec demo python -m shipper.verify_run --wait 150 --output /data/verification.json
          previous_start=$(docker exec demo python -c "import json; print(json.load(open('/data/runs/ci-controlled/heartbeat.json'))['started_at'])")
          docker restart demo
          docker exec demo python -m shipper.verify_run --wait 45 --previous-started-at "$previous_start" --output /data/verification-after-restart.json
          mkdir -p controlled-evidence
          docker cp demo:/data/verification.json controlled-evidence/verification.json
          docker cp demo:/data/verification-after-restart.json controlled-evidence/verification-after-restart.json
          for file in events.json scan-findings.json actions.jsonl target-check.json; do
            docker cp demo:/data/runs/ci-controlled/$file controlled-evidence/$file
          done
          docker logs demo
          docker stop demo
          docker stop clickhouse-ci
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-pipeline-evidence
          path: controlled-evidence/
      - name: Push verified image
        run: docker push ghcr.io/nayeonshin/cyberdefense-hackathon:${{ github.sha }}
